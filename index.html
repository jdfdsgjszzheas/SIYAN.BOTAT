<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه: معالجة الدفع جارية</title>
    <!-- استيراد خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fdf0f0;
            font-family: 'Tajawal', sans-serif;
            color: #333;
        }

        .alert-card {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(192, 57, 43, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border-top: 8px solid #c0392b;
        }

        .status-badge {
            background: #ffeaea;
            color: #c0392b;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .icon-box {
            font-size: 50px;
            color: #c0392b;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #c0392b;
        }

        p {
            font-size: 17px;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* ستايل العداد التنازلي */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: #c0392b;
            color: white;
            padding: 10px;
            border-radius: 10px;
            min-width: 60px;
        }

        .time-box span {
            display: block;
            font-size: 22px;
            font-weight: bold;
        }

        .time-box label {
            font-size: 10px;
            text-transform: uppercase;
        }

        .bot-link {
            display: inline-flex;
            align-items: center;
            background-color: #27ae60; /* لون أخضر للتحفيز */
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

        .bot-link:hover {
            background-color: #219150;
            transform: scale(1.05);
        }

        .bot-link i {
            margin-left: 10px;
        }

        .warning-footer {
            margin-top: 25px;
            font-size: 13px;
            color: #7f8c8d;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="alert-card">
        <div class="status-badge">
            <i class="fas fa-spinner fa-spin"></i> قيد المعالجة الآن
        </div>
        
        <div class="icon-box">
            <i class="fas fa-wallet"></i>
        </div>

        <h1>الدفع قيد المعالجة</h1>
        <p>نظام الدفع حالياً في مرحلة التدقيق النهائية. لضمان استلام مستحقاتك بشكل أسرع، يرجى الانتقال إلى البوت الثاني:</p>

        <!-- العداد التنازلي -->
        <div class="countdown-container">
            <div class="time-box">
                <span id="hours">24</span>
                <label>ساعة</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>دقيقة</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>ثانية</label>
            </div>
        </div>
        
        <a href="https://t.me/CH_XEC_bot" class="bot-link">
            <i class="fab fa-telegram-plane"></i>
            انتقل إلى @CH_XEC_bot
        </a>

        <div class="warning-footer">
            ⚠️ تنبيه: يجب الانتقال قبل انتهاء العداد لضمان سلامة بياناتك.
        </div>
    </div>

    <script>
        // إعداد وقت النهاية (بعد 24 ساعة من الآن)
        let countdownTime = new Date().getTime() + (24 * 60 * 60 * 1000);

        const updateCountdown = () => {
            const now = new Date().getTime();
            const distance = countdownTime - now;

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(interval);
                document.querySelector(".countdown-container").innerHTML = "انتهى الوقت";
            }
        };

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
